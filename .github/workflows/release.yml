name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check that the tag matches the plugin version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -n 's/^ \* Version: *//p' our-team-block.php)"
          stable_tag="$(sed -n 's/^Stable tag: *//p' readme.txt)"
          package_version="$(node -p "require('./package.json').version")"
          status=0
          for found in "our-team-block.php:$plugin_version" "readme.txt:$stable_tag" "package.json:$package_version"; do
            if [ "$tag_version" != "${found#*:}" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version ${found#*:} in ${found%%:*}."
              status=1
            fi
          done
          for file in src/block.json src/*/block.json; do
            block_version="$(node -p "require('./$file').version")"
            if [ "$tag_version" != "$block_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version $block_version in $file."
              status=1
            fi
          done
          exit $status

      - name: Build the block
        run: |
          npm ci
          npm run build

      - name: Package the plugin
        run: |
          mkdir -p dist/our-team-block
          cp -R our-team-block.php LICENSE readme.txt build dist/our-team-block/
          cd dist
          zip -rq our-team-block.zip our-team-block

      - name: Check the contents of the zip
        run: |
          entries="$(unzip -Z1 dist/our-team-block.zip)"
          status=0
          for file in our-team-block.php readme.txt LICENSE build/block.json build/index.js build/index.asset.php build/column/block.json build/text/block.json build/team-list/block.json build/team-member/block.json; do
            if ! printf '%s\n' "$entries" | grep -qx "our-team-block/$file"; then
              echo "our-team-block.zip is missing $file."
              status=1
            fi
          done
          exit $status

      - name: Extract the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/our-team-block.zip --title "Our Team Block ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
